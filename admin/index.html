<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="color-scheme" content="light dark">
    <title>动态后台 · BG2HHW</title>
    <link rel="icon" href="/assets/favicon-32.png?v=20261021ak" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="/css/admin.css?v=20261022am">
  </head>
  <body>
    <header class="admin-header">
      <a class="admin-brand" href="/">
        <span aria-hidden="true"></span>
        <strong>BG2HHW</strong>
        <small>CONTENT ADMIN</small>
      </a>
      <div class="admin-header-actions">
        <a href="/moments/">查看动态页</a>
        <button class="admin-logout" id="logoutButton" type="button" hidden>退出</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="login-view" id="loginView">
        <p class="admin-kicker">PRIVATE / ADMIN</p>
        <h1>发布一条新动态。</h1>
        <p class="admin-lead">
          登录后可以新增、编辑、发布或隐藏动态。登录状态会保持 12 小时。
        </p>
        <form class="login-form" id="loginForm">
          <label>
            <span>后台密码</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>
          <button type="submit">登录后台</button>
          <p class="form-message" id="loginMessage" role="status"></p>
        </form>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <div class="dashboard-head">
          <div>
            <p class="admin-kicker">CONTENT / CMS</p>
            <h1>内容管理</h1>
            <p class="admin-lead" id="dashboardSummary">正在读取内容…</p>
          </div>
          <button class="new-button" id="newButton" type="button">新建动态</button>
        </div>

        <div class="admin-tabs" role="tablist" aria-label="内容类型">
          <button class="admin-tab is-active" type="button" data-panel="moments" role="tab" aria-selected="true">
            动态管理
          </button>
          <button class="admin-tab" type="button" data-panel="site" role="tab" aria-selected="false">
            整站内容
          </button>
        </div>

        <div class="admin-grid" id="momentsPanel">
          <form class="editor" id="momentForm">
            <div class="editor-head">
              <div>
                <span class="editor-mode" id="editorMode">NEW ENTRY</span>
                <h2 id="editorTitle">新建动态</h2>
              </div>
              <button class="text-button" id="resetButton" type="button">清空</button>
            </div>

            <input id="momentId" type="hidden">

            <div class="field-row">
              <label>
                <span>日期</span>
                <input id="date" type="text" inputmode="numeric" placeholder="2026.10.21" required>
              </label>
              <label>
                <span>时间</span>
                <input id="time" type="text" placeholder="20:30 / 当天">
              </label>
            </div>

            <label>
              <span>分类</span>
              <input id="category" type="text" list="categories" value="日常" required>
              <datalist id="categories">
                <option value="站点">
                <option value="设计">
                <option value="工程">
                <option value="无线电">
                <option value="日常">
              </datalist>
            </label>

            <label>
              <span>标签</span>
              <input id="tags" type="text" placeholder="短波, 天线, 73">
              <small>用逗号分隔。</small>
            </label>

            <label>
              <span>正文</span>
              <textarea id="text" rows="6" required></textarea>
            </label>

            <div class="field-row">
              <label>
                <span>图片地址</span>
                <input id="image" type="text" placeholder="/assets/moments/photo.webp">
              </label>
              <label>
                <span>图片说明</span>
                <input id="imageCaption" type="text" placeholder="2026.10.21 / PHOTO">
              </label>
            </div>

            <label>
              <span>图片替代文字</span>
              <input id="imageAlt" type="text" placeholder="描述图片内容">
            </label>

            <div class="field-row">
              <label>
                <span>链接文字</span>
                <input id="linkLabel" type="text" placeholder="查看项目">
              </label>
              <label>
                <span>链接地址</span>
                <input id="linkHref" type="text" placeholder="/#work">
              </label>
            </div>

            <label class="publish-check">
              <input id="published" type="checkbox" checked>
              <span>立即发布</span>
            </label>

            <div class="editor-actions">
              <button class="save-button" type="submit">保存动态</button>
              <span class="form-message" id="formMessage" role="status"></span>
            </div>
          </form>

          <section class="entry-panel">
            <div class="entry-panel-head">
              <span>已保存动态</span>
              <button class="text-button" id="refreshButton" type="button">刷新</button>
            </div>
            <div class="admin-list" id="adminList"></div>
          </section>
        </div>

        <section class="site-panel" id="sitePanel" hidden>
          <div class="site-panel-head">
            <div>
              <p class="admin-kicker">SITE / JSON</p>
              <h2>编辑整站内容</h2>
              <p>
                管理首页身份、作品、札记、现在与联系方式。标题和正文允许少量
                <code>&lt;br&gt;</code>、<code>&lt;strong&gt;</code> 与
                <code>&lt;span&gt;</code> 标签。
              </p>
            </div>
            <a class="preview-link" href="/" target="_blank" rel="noreferrer noopener">
              预览主页 ↗
            </a>
          </div>

          <label class="site-editor-field">
            <span>SITE_CONTENT / JSON</span>
            <textarea id="siteEditor" spellcheck="false" aria-label="整站内容 JSON"></textarea>
          </label>

          <div class="site-actions">
            <button class="save-button" id="saveSiteButton" type="button">保存整站内容</button>
            <button class="text-button" id="formatSiteButton" type="button">格式化</button>
            <button class="text-button" id="reloadSiteButton" type="button">重新载入</button>
            <span class="form-message" id="siteMessage" role="status"></span>
          </div>
        </section>
      </section>
    </main>

    <div class="admin-toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/js/admin.js?v=20261022am"></script>
  </body>
</html>
